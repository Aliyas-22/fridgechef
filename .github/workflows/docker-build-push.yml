name: Docker Build and Push

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Build + Push to DockerHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fridgechef:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fridgechef:${{ github.sha }}
          build-args: |
            MONGODB_URI=mongodb://placeholder
            NEXTAUTH_SECRET=placeholder-build
            NEXTAUTH_URL=http://localhost:3000
            GEMINI_API_KEY=placeholder

      - name: Summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Image pushed: ${{ secrets.DOCKERHUB_USERNAME }}/fridgechef:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
