name: Secret Scan

on:
  push:
    branches: [main, feat/docker]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Gitleaks - Detect Hardcoded Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
