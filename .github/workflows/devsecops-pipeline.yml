name: DevSecOps Pipeline

on:
  push:
    branches: [main, feat/docker]

jobs:

  # ── STAGE 1 ────────────────────────────────────────────
  code-quality:
    name: "Stage 1 — Code Quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  # ── STAGE 2 ────────────────────────────────────────────
  secret-scan:
    name: "Stage 2 — Secret Scan"
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── STAGE 3 ────────────────────────────────────────────
  dockerfile-lint:
    name: "Stage 3 — Dockerfile Lint"
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  # ── STAGE 4 ────────────────────────────────────────────
  build-image:
    name: "Stage 4 — Build Docker Image"
    runs-on: ubuntu-latest
    needs: [secret-scan, dockerfile-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg MONGODB_URI=mongodb://placeholder \
            --build-arg NEXTAUTH_SECRET=placeholder-build \
            --build-arg NEXTAUTH_URL=http://localhost:3000 \
            --build-arg GEMINI_API_KEY=placeholder \
            -t fridgechef:${{ github.sha }} .

      - name: Save image as tar
        run: docker save fridgechef:${{ github.sha }} -o fridgechef.tar

      - uses: actions/upload-artifact@v4
        with:
          name: fridgechef-image
          path: fridgechef.tar
          retention-days: 1

  # ── STAGE 5 ────────────────────────────────────────────
  image-scan:
    name: "Stage 5 — Trivy Image Scan"
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fridgechef-image

      - name: Load image
        run: docker load -i fridgechef.tar

      - name: Trivy — show HIGH + CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fridgechef:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Trivy — fail on CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fridgechef:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # ── STAGE 6 ────────────────────────────────────────────
  push-image:
    name: "Stage 6 — Push to DockerHub"
    runs-on: ubuntu-latest
    needs: image-scan
    if: github.event_name == 'push'  
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fridgechef-image

      - name: Load image
        run: docker load -i fridgechef.tar

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push
        run: |
          docker tag fridgechef:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/fridgechef:${{ github.sha }}
          docker tag fridgechef:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/fridgechef:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fridgechef:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fridgechef:latest

      - name: Pipeline summary
        run: |
          echo "## DevSecOps Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile Lint | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Image Scan | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| DockerHub Push | ✅ Done |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ secrets.DOCKERHUB_USERNAME }}/fridgechef:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
